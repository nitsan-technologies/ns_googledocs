<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="content">
	<f:flashMessages />
	<div class="ns-googledocs-dashboard-blocks">
		<f:if condition="!{globalSettings.clientStatus}">
			<div class="alert alert-danger alert-dismissible show" role="alert">
				<f:format.raw><f:translate key="error_msg" extensionName="NsGoogledocs" /></f:format.raw>
				<button type="button" class="close" data-bs-dismiss="alert" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
		</f:if>
		<f:if condition="{globalSettings.clientException}">
			<div class="alert alert-danger alert-dismissible show" role="alert">
				{globalSettings.clientException}
				<button type="button" class="close" data-bs-dismiss="alert" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
		</f:if>
		<div class="row">
			<div class="col-md-12">
				<div class="card bg-light google-docs-import-block custom-card" data-mh="google-docs-import-block">
					<div class="card-header">
						<h5><f:translate key="dashboard_import_pages" extensionName="NsGoogledocs" /></h5>
					</div>
					<div class="card-body">
						<f:format.raw><f:translate key="dashboard_import_pages_steps" extensionName="NsGoogledocs" /></f:format.raw>
					</div>
				</div>
			</div>
			<div class="col-sm-12">
				<div class="footer__callout-info">
					<span class="footer__callout-info-icon"><core:icon identifier="actions-info" size="small" alternativeMarkupIdentifier="inline" /></span>
					<p><f:translate key="help_support" extensionName="NsGoogledocs" /></p>
					<a href="https://t3planet.com/support" target="_blank"><f:translate key="help_support_link" extensionName="NsGoogledocs" /></a>
				</div>
			</div>
		</div>
	</div>
</f:section>
</html>

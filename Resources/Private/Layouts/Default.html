<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
	  data-namespace-typo3-fluid="true">
	<script src="{f:uri.resource(path:'JavaScript/Jquery.js', extensionName: 'ns_googledocs')}"></script>
	<script type="module" src="{f:uri.resource(path:'JavaScript/Main.js', extensionName: 'ns_googledocs')}"></script>
	<script src="{f:uri.resource(path:'JavaScript/Datatables.js', extensionName: 'ns_googledocs')}"></script>
	<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Vendor/bootstrap4.3.1.min.css', extensionName: 'ns_googledocs')}" media="all">
	<link rel="stylesheet" type="text/css" href="{f:uri.resource(path:'Css/main.css', extensionName: 'ns_googledocs')}" media="all">
	<div class="typo3-fullDoc">
		<div id="typo3-docbody">
			<div id="typo3-inner-docbody" style="padding: 24px;margin-top: 0;transition: border .2s ease;">
				<div class="ns-ext-navigation-wrap">
					<div class="ns-googledocs-navigation ns-ext-navigation">
						<nav class="navbar">
							<div class="navbar-collapse show" id="nsbackupNavbar" style="display: flex; height: auto;">
								<ul class="navbar-nav">
									<li class="nav-item {f:if(condition: '{activePage} == \'dashboardAction\'', then: 'active')}">
										<f:link.action action="dashboard" class="nav-link">
											<core:icon identifier="module-dashboard" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="dashboard" extensionName="NsGoogledocs" />
										</f:link.action>
									</li>
									<li class="nav-item {f:if(condition: '{activePage} == \'importAction\'', then: 'active')}">
										<f:link.action action="import" class="nav-link">
											<core:icon identifier="actions-cloud-download" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="import_google_docs" extensionName="NsGoogledocs" />
										</f:link.action>
									</li>
									<li class="nav-item {f:if(condition: '{activePage} == \'globalSettingsAction\'', then: 'active')}">
										<f:link.action action="globalSettings" class="nav-link">
											<core:icon identifier="actions-cog" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="global_setting" extensionName="NsGoogledocs" />
										</f:link.action>
									</li>
								</ul>
							</div>
						</nav>
					</div>
				</div>
				<f:if condition="{premiumStrip}">
					<f:format.raw>{premiumStrip}</f:format.raw>
				</f:if>
				<f:render section="content" />
			</div>
		</div>

		<div class="modal google-docs-wizard-modal fade" id="googleDocsWizardModal" tabindex="-1" role="dialog" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title"><f:translate key="ns_google_docs_setup_wizard" extensionName="NsGoogledocs" /></h5>
						<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body">
						<div class="googledocs-form-wrap">
							<div class="row">
								<div class="col-lg-7">
									<f:form id="update-user-info" action="update" controller="UserInfo" enctype="multipart/form-data">
										<div class="form-group">
											<label for="google-docs-secret-key"><f:translate key="enter_secret_key" extensionName="NsGoogledocs" /></label>
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text" id="google-docs-secret-key">@</span>
												</div>
												<f:form.textfield
													class="form-control"
													name="GoogleDocsSecretKey"
													placeholder="{f:translate(key: 'enter_secret_key', extensionName: 'NsGoogledocs')}"
													value="{globalSettings.clientInfo.client_secret}"
													additionalAttributes="{aria-describedby: 'bw-clientsecret', required: 'required'}"/>
											</div>
										</div>
										<div class="form-group">
											<label for="google-docs-client-id"><f:translate key="enter_client_id" extensionName="NsGoogledocs" /></label>
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text" id="google-docs-client-id">@</span>
												</div>
												<f:form.textfield
													class="form-control"
													name="GoogleDocsClientId"
													placeholder="{f:translate(key: 'enter_client_id', extensionName: 'NsGoogledocs')}"
													value="{globalSettings.clientInfo.client_id}"
													additionalAttributes="{aria-describedby: 'bw-clientid', required: 'required'}"/>
											</div>
										</div>
										<div class="form-group">
											<label for="google-docs-refresh-token"><f:translate key="enter_refresh_token" extensionName="NsGoogledocs" /></label>
											<div class="input-group">
												<div class="input-group-prepend">
													<span class="input-group-text" id="google-docs-refresh-token">@</span>
												</div>
												<f:form.textfield
													class="form-control"
													name="GoogleDocsRefreshToken"
													placeholder="{f:translate(key: 'enter_refresh_token', extensionName: 'NsGoogledocs')}"
													value="{globalSettings.clientInfo.refresh_token}"
													additionalAttributes="{aria-describedby: 'bw-efreshtoken', required: 'required'}"/>
											</div>
										</div>
										<div class="form-group">
											<label for="imaport-in-pages"><f:translate key="where_import" extensionName="NsGoogledocs" /></label>
											<div class="form-check">
												<f:if condition="{globalSettings.clientInfo.import_type.1}">
													<f:then>
														<f:form.checkbox name="importType" id="imaport-in-pages" value="1" checked="1" multiple="1" class="form-check-input" />
													</f:then>
													<f:else>
														<f:form.checkbox name="importType" id="imaport-in-pages" value="1" multiple="1" class="form-check-input" />
													</f:else>
												</f:if>
												<label class="form-check-label" for="imaport-in-pages">
													<f:translate key="import_type.1" extensionName="NsGoogledocs" />
												</label>
											</div>
										</div>
										<div class="form-group">
											<button type="submit" class="btn btn-danger">
												<core:icon identifier="actions-save" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="btn_save_settings" extensionName="NsGoogledocs" />
											</button>
											<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
												<core:icon identifier="actions-close" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="btn_skip" extensionName="NsGoogledocs" />
											</button>
										</div>
									</f:form>
								</div>
								<div class="col-lg-5">
									<f:format.raw>{googleDocsSetupWizard}</f:format.raw>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<f:if condition="{activePage} == 'importAction'">
			<div class="modal fade google-docs-wizard-modal" id="importGooleDocsModal" tabindex="-1" role="dialog" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered" role="document">
					<div class="modal-content">
						<f:form id="docsImport" action="docsImport" class="googledocs-form" controller="UserInfo" enctype="multipart/form-data" method="POST" additionalParams="{id: pageId}">
							<f:form.hidden name="pageId" id="google-docs-page-id" value="{pageId}" />
							<f:form.hidden name="googleDocsUrl" id="google-docs-url" value="" />
							<f:form.hidden name="googleDocsID" id="google-docs-id" value="" />
							<f:form.hidden name="googleDocsName" id="google-docs-name" value="" />
							<div class="modal-header">
								<h5 class="modal-title"><f:format.raw><f:translate key="import_about" extensionName="NsGoogledocs" /></f:format.raw></h5>
								<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
									<span aria-hidden="true">&times;</span>
								</button>
							</div>
							<div class="modal-body">
								<div class="googledocs-form-wrap">
									<p class="ns-gd-import-message"><f:format.raw><f:translate key="import-message" extensionName="NsGoogledocs" /></f:format.raw> {globalSettings.docsImportType}?</p>
									<div class="ns-gd-import-fields">
										<div class="form-group ns-gd-field">
											<label for="select-column"><f:translate key="select_column" extensionName="NsGoogledocs" /></label>
											<div class="ns-gd-select">
												<f:form.select id="select-column" class="form-control form-select" name="colPos" options="{pageColPos}" optionValueField="colPos" optionLabelField="label" />
											</div>
										</div>
										<div class="form-group ns-googledocs-progressbar-wrap-main hide ns-gd-field">
											<label><f:translate key="Importing" extensionName="NsGoogledocs" /></label>
											<div class="ns-googledocs-progressbar-wrap">
												<div class="progress">
													<div id="custom-progress-bar" class="progress-bar bg-success" role="progressbar"
														style="width: 1%;" aria-valuenow="1" aria-valuemin="0"
														aria-valuemax="100">1%</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="modal-footer import-footer">
								<button type="button" class="btn btn-default" data-bs-dismiss="modal">
									<core:icon identifier="actions-close" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="btn_close" extensionName="NsGoogledocs" />
								</button>
								<button type="submit" class="btn btn-success btn-import-now" data-version="{version}" data-page-id="{pageId}">
									<core:icon identifier="actions-download" size="small" alternativeMarkupIdentifier="inline" /><f:translate key="btn_import_now" extensionName="NsGoogledocs" />
								</button>
							</div>
						</f:form>
					</div>
				</div>
			</div>
		</f:if>
	</div>
</html>
